    description: UIにプッシュされるリソースの更新はWebSocketを介して行われ、UIスレッドで処理されます。このオプションを有効にすると、クラスタのWebSocket更新が別のスレッドのWebワーカーで処理されます。これにより、リソースが頻繁に変更されるシステムでのUIの応答性が向上します。
    checkboxLabel: 高度なWebSocketウェブワーカーを有効にする
  inactivity:
