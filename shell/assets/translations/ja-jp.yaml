    moreActions: 設定のその他のアクション - { setting }
    label: 設定の編集
    changeSetting: "設定の変更："
    trueOption: "True"
    falseOption: "False"
    value: 値
    useDefault: デフォルト値を使用
    invalidJSON: 無効なJSONです - 保存する前に入力を確認・修正してください
  descriptions:
    'cacerts': "サーバーの証明書を検証するために必要なCA証明書。"
    'password-min-length': 'ユーザーパスワードに必要な最小文字数を定義します。'
    'cluster-defaults': '新しいクラスタを作成する際にRKEのデフォルトを上書きします。'
    'engine-install-url': 'デフォルトのDockerエンジンインストールURL（ほとんどのノードドライバ用）。'
    'engine-iso-url': 'デフォルトのOSインストールURL（vSphereドライバ用）。'
    'engine-newest-version': 'このリリース時点でサポートされているDockerの最新バージョン。サポートされているDockerの範囲を満たさないがこれより新しいDockerバージョンは、未テストとしてマークされます。'
    'engine-supported-range': 'サポートされているDockerエンジンバージョンのSemver範囲。この範囲を満たさないバージョンはUIでサポート対象外としてマークされます。'
    'ingress-ip-domain': '自動生成されるIngressホスト名に使用するワイルドカードDNSドメイン。<ingress-name>.<namespace-name>.<ip address of ingress controller>がドメインに追加されます。'
    'server-url': 'デフォルトの{appName}インストールURL。HTTPSである必要があります。クラスタ内のすべてのノードがこれに到達できる必要があります。'
    'system-default-registry': 'すべてのRancherシステムコンテナイメージに使用されるプライベートレジストリ。値が指定されていない場合、コンテナランタイムのデフォルトレジストリが使用されます。Dockerとcontainerdの場合、デフォルトは`docker.io`です。'
    'ui-index': 'クラスタマネージャUIのHTMLインデックスの場所。'
    'ui-dashboard-index': '{appName} UIのHTMLインデックスの場所。'
    'ui-offline-preferred': 'UIアセットがサーバーコンテナによってローカルで提供されるか、ui-indexおよびui-dashboard-index設定で定義されたリモートURLから提供されるかを制御します。「動的」オプションは、{appName}の製品ビルドでローカルアセットを使用します。'
    'ui-pl': 'プライベートラベルの会社名。'
    'auth-user-info-max-age-seconds': '認証プロバイダーのグループメンバーシップ同期が実行される前の、ユーザーの認証トークンの最大有効期間。'
    'auth-user-info-resync-cron': '認証プロバイダーのグループメンバーシップを再同期するためのデフォルトのcronスケジュール。'
    'cluster-template-enforcement': '管理者以外のユーザーは、事前に承認されたRKEテンプレートを介してのみクラスタを起動することが制限されます。'
    'auth-user-session-ttl-minutes': 'ユーザー認証セッションのカスタムTTL（分単位）。'
    'auth-token-max-ttl-minutes': 'すべての認証トークンの最大TTL（分単位）。0に設定すると、トークンは期限切れになりません。'
    'kubeconfig-generate-token': 'kubeconfigが要求されたときにユーザーのトークンを自動的に生成します。'
