typeDescription:
  # Map of
  # type: Description to be shown on the top of list view describing the type.
  #       Should fit on one line.
  #       If you link to anything external, it MUST have
  #       target="_blank" rel="noopener noreferrer nofollow"
  jwt.authentication: この機能をクラスタで有効にすると、下流のサービスアカウントのJWT認証のサポートが追加されます。
  branding: "ブランディングにより、管理者はRancherの製品名、ロゴ、カラースキームをカスタマイズしてUIをグローバルに再ブランド化できます。"
  chart: "特に指示がない限り、すべてのチャートにはLinuxおよびWindowsノードを持つクラスタにインストール可能なバージョンが少なくとも1つあります。"
  compliance.cattle.io.clusterscanbenchmark: ベンチマークバージョンは、kube-benchを使用して実行するベンチマークの名前と、そのベンチマークの有効な設定パラメータです。
  compliance.cattle.io.clusterscanprofile: プロファイルは、コンプライアンススキャンの設定であり、使用するベンチマークバージョンとそのベンチマークでスキップする特定のテストです。
  compliance.cattle.io.clusterscan: スキャンは、定義されたプロファイルに基づいてクラスタでコンプライアンススキャンをトリガーするために作成されます。スキャン完了後にレポートが作成されます。
  compliance.cattle.io.clusterscanreport: レポートは、クラスタのコンプライアンススキャンの結果です。
  management.cattle.io.feature: 機能フラグにより、特定の{vendor}の機能をオンまたはオフに切り替えることができます。デフォルトでオフになっている機能は実験的な機能と見なしてください。
  cluster.x-k8s.io.machine: マシンはKubernetesノードの設定をカプセル化します。クラスタ更新後に何が起こるかを確認するには、このビューを使用します。
  cluster.x-k8s.io.machinedeployment: マシンデプロイメントは、マシンセットのコレクション上でテンプレートを介してデプロイメントを調整します（デプロイメントに似ています）。クラスタ更新後に何が起こるかを確認するには、このビューを使用します。
  cluster.x-k8s.io.machineset: マシンセットは、常に望ましい数のマシンリソースが稼働していることを保証します（ReplicaSetに似ています）。クラスタ更新後に何が起こるかを確認するには、このビューを使用します。
  resources.cattle.io.backup: バックアップは、ResourceSetに基づいて1回限りのバックアップを実行したり、定期的なバックアップをスケジュールしたりするために作成されます。
  resources.cattle.io.restore: 復元は、バックアップファイルに基づいてクラスタへの復元をトリガーするために作成されます。
  resources.cattle.io.resourceset: リソースセットは、バックアップに保存するCRDとリソースを定義します。
  monitoring.coreos.com.servicemonitor: サービスモニターは、Prometheusがメトリクスをスクレイプするサービスのグループとエンドポイントを定義します。これはメトリクス収集を定義する最も一般的な方法です。
  monitoring.coreos.com.podmonitor: Podモニターは、PrometheusがメトリクスをスクレイプするPodのグループを定義します。一般的な方法はサービスモニターを使用することですが、Podモニターを使用すると、サービスモニターが機能しない状況にも対応できます。
  monitoring.coreos.com.prometheusrule: Prometheusルールリソースは、記録ルールとアラートルールの両方を定義します。記録ルールは値を事前に計算して結果を保存できます。アラートルールを使用すると、AlertManagerに通知を送信する条件を定義できます。
  monitoring.coreos.com.prometheus: Prometheusサーバーは、スクレイプ設定とルールが選択されたServiceMonitor、PodMonitor、およびPrometheusRuleによって決定され、そのアラートがカスタムリソースの設定で選択されたすべてのAlertmanagerに送信されるPrometheusデプロイメントです。
  monitoring.coreos.com.alertmanager: アラートマネージャーは、同じ名前空間内のシークレットによって設定が指定されるデプロイメントであり、どのアラートをどのレシーバーに送信するかを決定します。
  node: 基本的なKubernetesノードリソースは、デプロイメントをホストする仮想または物理マシンを表します。マシンライフサイクルを管理するには、利用可能な場合はクラスター管理に移動してください。
  catalog.cattle.io.clusterrepo: 'チャートリポジトリは、Helmリポジトリまたは{vendor}のgitベースのアプリケーションカタログです。クラスタで利用可能なチャートのリストを提供します。'
  catalog.cattle.io.clusterrepo.local: 'チャートリポジトリは、Helmリポジトリまたは{vendor}のgitベースのアプリケーションカタログです。クラスタで利用可能なチャートのリストを提供します。クラスタテンプレートはHelmチャートを介してデプロイされます。'
  catalog.cattle.io.operation: 操作は、クラスタに適用された最近のHelm操作のリストです。
  catalog.cattle.io.app: インストール済みアプリケーションは、当社のチャートまたはHelm CLIを介してインストールされたHelm 3チャートです。
  logging.banzaicloud.io.clusterflow: クラスタからのログは収集され、選択されたクラスタ出力に記録されます。
  logging.banzaicloud.io.clusteroutput: クラスタ出力は、ログを送信できるロギングプロバイダーを定義し、ロギングオペレーターが存在する名前空間にデプロイされた場合にのみ有効です。
  logging.banzaicloud.io.flow: フローは、収集およびフィルタリングするログと、ログを送信する出力を定義します。フローは名前空間リソースであり、フローがデプロイされている名前空間からのみログが収集されることを意味します。
  logging.banzaicloud.io.output: 出力は、ログを送信できるロギングプロバイダーを定義します。出力は、それを使用しているフローと同じ名前空間にある必要があります。
  group.principal: グループへのグローバルロールの割り当ては、グループをサポートする外部認証プロバイダーでのみ機能します。ローカル認証はグループをサポートしていません。
  management.cattle.io.oidcclient: ここで、RancherのシングルサインオンIDプロバイダーにアプリケーションを追加できます

