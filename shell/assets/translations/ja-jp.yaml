      medium:
        label: メディア
        default: ノードのデフォルトメディア
        memory: メモリ
      sizeLimit:
        label: サイズ制限
        placeholder: "例：300"
  typeDescriptions:
    apps.daemonset: DaemonSetは、適格な各ノードで正確に1つのPodを実行します。新しいノードがクラスタに追加されると、DaemonSetは自動的にそれらにデプロイされます。ノードごとに1つ以上のPodを必要としない、システム全体または垂直にスケーラブルなワークロードに推奨されます。
    apps.deployment: Deploymentは、適格なノード間に分散されたスケーラブルな数のPodレプリカを実行します。変更は段階的にロールアウトされ、必要に応じて前のリビジョンにロールバックできます。ステートレスで水平にスケーラブルなワークロードに推奨されます。
    apps.statefulset: StatefulSetは、ステートフルなアプリケーションを管理し、作成されるPodの順序と一意性に関する保証を提供します。永続的なストレージまたは厳密なID、クォーラム、またはアップグレード順序の要件を持つワークロードに推奨されます。
    batch.cronjob: CronJobは、繰り返しスケジュールでジョブを作成し、その後Podを実行します。スケジュールは標準のUnix cron形式で表現され、Kubernetesコントロールプレーンのタイムゾーン（通常はUTC）を使用します。
    batch.job: ジョブは、Podを正常に終了するまで実行することにより、1回限りのタスクを確実に実行するために1つ以上のPodを作成します。失敗したPodは、指定された完了実行数に達するまで自動的に置き換えられます。ジョブは、複数のPodを並行して実行したり、バッチ作業キューとして機能したりすることもできます。
    pod: Podは、Kubernetesで作成および管理できる最小のデプロイ可能なコンピューティングユニットです。Podは、共有ストレージとネットワークリソース、およびコンテナの実行方法の仕様を持つ1つ以上のコンテナのグループです。
  upgrading:
    activeDeadlineSeconds:
      label: Podアクティブデッドライン
      tip: システムがPodを失敗とマークして関連コンテナを強制終了しようとする前に、Podがアクティブでいられる期間。
    concurrencyPolicy:
      label: 並行性
      options:
        allow: CronJobの同時実行を許可
        forbid: 現在の実行が終了していない場合、次の実行をスキップ
        replace: 現在の実行が終了していない場合、実行を置き換え
    maxSurge:
      label: 最大サージ
      tip: 任意の時点で希望のスケールを超えて許可されるPodの最大数。
    maxUnavailable:
      label: 最大利用不可数
      tip: 任意の時点で利用できなくなる可能性のあるPodの最大数。
    minReadySeconds:
      label: 最小準備時間
      tip: Podが利用可能と見なされるために、コンテナがクラッシュすることなく準備完了であるべき最小期間。
    podManagementPolicy:
      label: Pod管理ポリシー
    progressDeadlineSeconds:
      label: 進捗デッドライン
      tip: デプロイメントが失敗とマークされる前に、デプロイメントの進行を待つ最小期間。
    revisionHistoryLimit:
      label: リビジョン履歴の制限
      tip: ロールバックのために保持する古いReplicaSetの数。
    strategies:
      labels:
        delete: "削除時：新しいPodは、古いPodが手動で削除されたときにのみ作成されます。"
        recreate: "再作成：すべてのPodを強制終了し、その後新しいPodを開始します。"
        rollingUpdate: "ローリングアップデート：古いPodを削除する前に、最大サージに達するまで新しいPodを作成します。最大利用不可数より多くのPodを停止しません。"
    terminationGracePeriodSeconds:
      label: 終了猶予期間
      tip: Podが正常に終了するために必要な期間。
    title: アップグレード
  tabs:
    labels:
      deployment: デプロイメント
      pod: Pod
      containers: コンテナ

